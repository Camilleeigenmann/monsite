{% extends 'monapp/base.html' %}
{% load static %}

{% block extra_css %}

{% endblock %}

{% block content %}

{% if activite %}
<h1>Ajouter une photo à l'activité du {{activite.date}}</h1>
{%  else %}
<h1>Enregistrez une photo</h1>
{% endif %}
<form enctype="multipart/form-data" method="post" >
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Enregistrer" >
</form>
{% endblock %}

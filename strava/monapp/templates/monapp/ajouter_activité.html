{% extends 'monapp/base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'monapp/ajouter_activité.css' %}">
{% endblock %}

{% block content %}
<h1>Ajoutez une activité</h1>
<form action="" method="post" >
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Enregistrer" >
</form>
{% if programme_utilisé %}
<div>Nom du programme utilisé: {{programme_utilisé.titre}}</div>
{% endif %}
{% endblock %}
